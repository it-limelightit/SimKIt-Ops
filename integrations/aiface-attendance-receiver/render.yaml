# Render Free preview: idle sleeping and ephemeral queue storage remain limitations.
services:
  - type: web
    name: simkit-aiface-attendance
    runtime: node
    plan: free
    rootDir: integrations/aiface-attendance-receiver
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MQTT_URL
        value: mqtt://62.72.43.204:1883
      - key: MQTT_CLIENT_ID
        value: simkit-aiface-render
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: ATTENDANCE_DEVICE_ID
        value: AYUE22065256
      - key: ATTENDANCE_EVENT_TOPIC
        value: aiface/AYUE22065256/sub/stellar
      - key: ATTENDANCE_COMMAND_TOPIC
        value: aiface/AYUE22065256/pub/stellar
      - key: ATTENDANCE_DEVICE_WEBHOOK_URL
        value: https://jhhiwyvrhfhvvougkqmm.supabase.co/functions/v1/attendance-device-event
      - key: ATTENDANCE_DEVICE_WEBHOOK_SECRET
        sync: false
      - key: RECEIVER_DB
        value: /tmp/simkit-attendance/receiver.sqlite
